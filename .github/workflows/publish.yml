name: Publish to NuGet

# Packages publish ONLY from the release branch: push a version tag whose commit lives on
# `release` (or `release/**`). The tag name becomes the package version; pre-release tags
# (with a '-suffix', e.g. 1.0.0-rc-1) land in the NuGet pre-release channel automatically.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

env:
  PROJECT: sources/Lite.Serialization.Protobuf/Lite.Serialization.Protobuf.csproj
  TESTS: test/Lite.Serialization.Protobuf.Tests/Lite.Serialization.Protobuf.Tests.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full refs to check which branch contains the tag

      - name: Ensure the tag is on a release branch
        run: |
          if git branch -r --contains "$GITHUB_SHA" | grep -Eq 'origin/release($|/)'; then
            echo "Tag ${GITHUB_REF_NAME} is on a release branch — proceeding."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} is not on a release branch; packages publish only from release."
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lite.Serialization.Protobuf.sln

      # Gate the release on a green test run.
      - name: Test
        run: dotnet test "$TESTS" -c Release --verbosity normal

      - name: Pack
        run: >
          dotnet pack "$PROJECT" -c Release -o ./nupkg
          -p:Version="$GITHUB_REF_NAME"
          -p:PackageVersion="$GITHUB_REF_NAME"

      # Attach the .nupkg to the workflow run (downloadable even if the NuGet push fails).
      - name: Upload .nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lite.Serialization.Protobuf-${{ github.ref_name }}
          path: ./nupkg/*.nupkg
          if-no-files-found: error

      - name: Push to NuGet
        run: >
          dotnet nuget push "./nupkg/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate

      # GitHub Release for the trigger tag, with the .nupkg attached.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=
          case "${GITHUB_REF_NAME}" in *-*) PRERELEASE=--prerelease ;; esac
          gh release create "${GITHUB_REF_NAME}" ./nupkg/*.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes $PRERELEASE
