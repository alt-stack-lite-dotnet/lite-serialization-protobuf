name: CI

# Build + test on every push to any branch, and on every pull request.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lite.Serialization.Protobuf.sln

      - name: Build
        run: dotnet build Lite.Serialization.Protobuf.sln -c Release --no-restore

      - name: Test
        run: dotnet test Lite.Serialization.Protobuf.sln -c Release --no-build --verbosity normal
