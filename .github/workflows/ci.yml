name: CI

on:
  push:
    branches: ['**']          # build on every push, any branch
  pull_request:
    branches: [develop, master, 'release/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lite.Serialization.Protobuf.sln

      - name: Build
        run: dotnet build Lite.Serialization.Protobuf.sln -c Release --no-restore

      # Tests run on pushes/merges to develop and on any pull request.
      # (They also run during publish — see publish.yml.)
      - name: Test
        if: github.ref == 'refs/heads/develop' || github.event_name == 'pull_request'
        run: dotnet test Lite.Serialization.Protobuf.sln -c Release --no-build --verbosity normal
